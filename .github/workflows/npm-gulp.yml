name: Node.js CI with Gulp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install dependencies
        env:
          CI: true
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci for deterministic installs"
            npm ci --prefer-offline --no-audit --progress=false
          else
            echo "No package-lock.json found — falling back to npm install"
            npm install --no-audit --progress=false
          fi

      - name: Run lint (if defined)
        shell: bash
        run: |
          if npm run | grep -qE '(^| )lint($| )'; then
            echo "Running lint script"
            npm run lint
          else
            echo "No lint script defined — skipping"
          fi

      - name: Run tests (if defined)
        shell: bash
        run: |
          if npm run | grep -qE '(^| )test($| )'; then
            echo "Running test script"
            npm test -- --ci
          else
            echo "No test script defined — skipping"
          fi

      - name: Build (prefer npm build, otherwise run Gulp)
        shell: bash
        run: |
          if npm run | grep -qE '(^| )build($| )'; then
            echo "Running npm run build"
            npm run build
          elif npx --yes gulp --tasks-simple >/dev/null 2>&1; then
            echo "No build script — running Gulp"
            npx --yes gulp --no-color
          else
            echo "No build script and no Gulp configuration found — skipping build step"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            dist
            build
            public
            coverage
          if-no-files-found: ignore
          retention-days: 7
